apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "geocontrib.fullname" . }}-redis-depl
  labels:
    {{- include "geocontrib.labels" . | nindent 4 }}-redis-depl
    app.neogeo.fr: geocontrib
spec:
  selector:
    matchLabels:
      {{- include "geocontrib.selectorLabels" . | nindent 6 }}-redis-depl
  template:
    metadata:
      labels:
        {{- include "geocontrib.selectorLabels" . | nindent 8 }}-redis-depl
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.pullPolicy }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          startupProbe:
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 2
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep -q PONG
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
